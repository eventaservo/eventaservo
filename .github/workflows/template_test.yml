name: Rails tests

on:
  workflow_call:
    secrets:
      RAILS_MASTER_KEY:
        required: true
      CODECOV_TOKEN:
        required: true
      QLTY_COVERAGE_TOKEN:
        required: true

jobs:
  minitest:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15.7
        env:
          POSTGRES_DB: eventaservo_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d eventaservo_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      RAILS_ENV: test
      RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Ruby e Bundler
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Node 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: "yarn"

      - name: Yarn
        run: yarn install --frozen-lockfile

      - name: Precompile assets
        run: SECRET_KEY_BASE_DUMMY=1 ./bin/rails assets:precompile

      - name: Prepare Test
        run: |
          bundle exec rails db:test:prepare

      - name: Run Minitest
        run: bundle exec rails test

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage to Qlty
        uses: qltysh/qlty-action/coverage@ebcd284bf32e36a030afe15f1e136c7be08b9506 # v2.5.0
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: coverage/coverage.xml
          tag: minitest

  system_tests:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15.7
        env:
          POSTGRES_DB: eventaservo_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d eventaservo_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      RAILS_ENV: test
      RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Ruby e Bundler
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Node 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: "yarn"

      - name: Yarn
        run: yarn install --frozen-lockfile

      - name: Precompile assets
        run: SECRET_KEY_BASE_DUMMY=1 ./bin/rails assets:precompile

      - name: Prepare Test
        run: |
          bundle exec rails db:test:prepare

      - name: Run System Tests
        run: bundle exec rails test:system

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage to Qlty
        uses: qltysh/qlty-action/coverage@ebcd284bf32e36a030afe15f1e136c7be08b9506 # v2.5.0
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: coverage/coverage.xml
          tag: system_tests
