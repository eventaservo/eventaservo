openapi: 3.1.0
info:
  title: EventaServo API
  version: '2.0'
  contact:
    name: Fernando Shayani
    url: 'https://github.com/eventaservo'
    email: fernando@eventaservo.org
  termsOfService: 'https://eventaservo.org/LICENSE'
  license:
    name: AGPL-3.0
    url: 'https://github.com/eventaservo/eventaservo/blob/main/LICENSE'
  summary: EventaServo API v2
  description: |
    EventaServo is a platform for organizing and publicizing Esperanto events worldwide.
    This API v2 provides programmatic access to events and organizations.
servers:
  - url: 'https://eventaservo.org/api/v2'
    description: Production
  - url: 'https://testservilo.eventaservo.org/api/v2'
    description: Staging
paths:
  /eventoj:
    get:
      summary: List events
      description: >
        List events by date range, country, or organization.
        You must provide either `komenca_dato` + `fina_dato` **or** `uuid`.
      tags:
        - Events
      operationId: get-events-index
      parameters:
        - name: komenca_dato
          in: query
          required: false
          description: Start date of the filter period (YYYY-MM-DD). Required when `uuid` is not provided.
          schema:
            type: string
            format: date
            example: '2026-01-01'
        - name: fina_dato
          in: query
          required: false
          description: End date of the filter period (YYYY-MM-DD). Required when `uuid` is not provided.
          schema:
            type: string
            format: date
            example: '2026-12-31'
        - name: uuid
          in: query
          required: false
          description: UUID of a specific event. When provided, `komenca_dato` and `fina_dato` are not needed.
          schema:
            type: string
            format: uuid
            example: e567bdc3-0ea2-46cc-8a83-3b11facbe16c
        - name: landa_kodo
          in: query
          required: false
          description: Filter by 2-letter country code. Case-insensitive (e.g. `BR`, `br`, `Fr`).
          schema:
            type: string
            example: BR
        - name: o
          in: query
          required: false
          description: Filter by organization short name (e.g. `UEA`).
          schema:
            type: string
            example: UEA
      responses:
        '200':
          description: A list of events matching the filter criteria.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
              examples:
                Example 1:
                  value:
                    - uuid: 206da237-65ee-4b86-96f6-5bd4cc3bd210
                      kodo: ab6712d
                      titolo: 1-a Universala Kongreso
                      priskribo: La unua Universala Kongreso de Esperanto!
                      enhavo: Detalaj informoj pri la evento
                      komenca_dato: '1905-08-05'
                      fina_dato: '1905-08-12'
                      retpagho: 'https://uea.org'
                      retposhtadreso: kontakto@uea.org
                      organizoj:
                        - UEA
                      specoj:
                        - Kongreso
                      nuligita: true
                      nuligkialo: null
                      reta: true
                      loko:
                        adreso: Stratnomo
                        urbo: Bulonjo ĉe maro
                        lando: Francio
                        landokodo: FR
                        kontinento: Eŭropo
                        latitudo: 50.725231
                        longitudo: 1.613334
                      administranto: Universala Esperanto-Asocio
        '400':
          description: Missing or invalid parameters.
          content:
            application/json:
              schema:
                type: object
                properties:
                  eraro:
                    type: string
                    description: Error message in Esperanto.
                    example: Mankas komenca_dato kaj fina_dato aŭ eventa UUID
  /events:
    get:
      summary: List manageable events
      description: >
        List non-deleted events that the authenticated user can manage (events owned
        by the user or linked to organizations the user belongs to), ordered by
        start date descending.
      tags:
        - Events (English)
      operationId: list-managed-events
      parameters:
        - name: status
          in: query
          required: false
          description: Filter events by time status (`upcoming`, `past`, or `all`). Defaults to `all`.
          schema:
            type: string
            enum:
              - upcoming
              - past
              - all
            default: all
        - name: page
          in: query
          required: false
          description: Page number (1-based).
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          required: false
          description: Number of items per page (default 20, max 100).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Paginated list of manageable events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedEventList'
        '401':
          description: Missing, invalid, or expired JWT token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Account is disabled or unconfirmed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create an event
      description: >
        Create a new event owned by the authenticated user.
        Rate-limited to 30 write requests per minute per token.
      tags:
        - Events (English)
      operationId: create-event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCreateInput'
      responses:
        '201':
          description: Event created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedEvent'
        '401':
          description: Missing, invalid, or expired JWT token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Account is disabled or unconfirmed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '429':
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /events/{uuid}:
    parameters:
      - name: uuid
        in: path
        required: true
        description: Immutable UUID of the event.
        schema:
          type: string
          format: uuid
          example: 206da237-65ee-4b86-96f6-5bd4cc3bd210
    get:
      summary: Get an event by UUID
      description: Returns any non-deleted event by its UUID.
      tags:
        - Events (English)
      operationId: get-event
      responses:
        '200':
          description: Event details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedEvent'
        '401':
          description: Missing, invalid, or expired JWT token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Event not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      summary: Update an event
      description: >
        Partially update an event. Allowed for the event owner, members of any
        organization linked to the event, or administrators. Omitting `tags` or
        `organization_short_names` preserves existing associations; passing `[]`
        clears them.
      tags:
        - Events (English)
      operationId: update-event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventUpdateInput'
      responses:
        '200':
          description: Event updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedEvent'
        '401':
          description: Missing, invalid, or expired JWT token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: User is not authorized to edit this event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Event not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '429':
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update an event (PUT alias)
      description: Same behavior as `PATCH /events/{uuid}`.
      tags:
        - Events (English)
      operationId: replace-event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventUpdateInput'
      responses:
        '200':
          description: Event updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedEvent'
        '401':
          description: Missing, invalid, or expired JWT token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: User is not authorized to edit this event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Event not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '429':
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Soft-delete an event
      description: >
        Marks the event as deleted. Allowed for the event owner, members of any
        organization linked to the event, or administrators.
      tags:
        - Events (English)
      operationId: delete-event
      responses:
        '204':
          description: Event soft-deleted successfully.
        '401':
          description: Missing, invalid, or expired JWT token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: User is not authorized to delete this event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Event not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /events/{uuid}/cancel:
    parameters:
      - name: uuid
        in: path
        required: true
        description: Immutable UUID of the event.
        schema:
          type: string
          format: uuid
    post:
      summary: Cancel an event
      description: Marks an event as cancelled with an optional reason.
      tags:
        - Events (English)
      operationId: cancel-event
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelEventInput'
      responses:
        '200':
          description: Event cancelled successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedEvent'
        '401':
          description: Missing, invalid, or expired JWT token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: User is not authorized to cancel this event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Event not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /events/{uuid}/uncancel:
    parameters:
      - name: uuid
        in: path
        required: true
        description: Immutable UUID of the event.
        schema:
          type: string
          format: uuid
    post:
      summary: Uncancel an event
      description: Clears the cancelled flag and cancellation reason on an event.
      tags:
        - Events (English)
      operationId: uncancel-event
      responses:
        '200':
          description: Event uncancelled successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedEvent'
        '401':
          description: Missing, invalid, or expired JWT token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: User is not authorized to uncancel this event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Event not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /organizations:
    get:
      summary: List organizations
      description: List all organizations, optionally filtered by country code.
      tags:
        - Organizations
      operationId: get-organizations
      parameters:
        - name: country_code
          in: query
          required: false
          description: Filter by 2-letter country code (e.g. `BR`, `NL`).
          schema:
            type: string
            example: BR
      responses:
        '200':
          description: A list of organizations with total count.
          content:
            application/json:
              schema:
                type: object
                required:
                  - count
                  - organizations
                properties:
                  count:
                    type: integer
                    description: Total number of organizations matching the filter.
                    example: 5
                  organizations:
                    type: array
                    items:
                      $ref: '#/components/schemas/Organization'
components:
  securitySchemes:
    JWTToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT token obtained from your account settings at
        https://eventaservo.org/users/edit.
        Send as: `Authorization: Bearer ***`
    UserToken:
      type: apiKey
      in: query
      name: user_token
      description: |
        Alternative to the Bearer header. Pass the JWT token as a query parameter.
  schemas:
    Event:
      type: object
      description: An Esperanto event with details.
      properties:
        uuid:
          type: string
          format: uuid
          description: Unique event identifier.
          example: 206da237-65ee-4b86-96f6-5bd4cc3bd210
        kodo:
          type: string
          description: Short event code.
          example: ab6712d
        titolo:
          type: string
          description: Event title.
          example: 1-a Universala Kongreso
        priskribo:
          type: string
          description: Short event description.
          example: La unua Universala Kongreso de Esperanto!
        enhavo:
          type: string
          nullable: true
          description: Full event description.
          example: Detalaj informoj pri la evento
        komenca_dato:
          type: string
          format: date
          description: Event start date.
          example: '1905-08-05'
        fina_dato:
          type: string
          format: date
          description: Event end date.
          example: '1905-08-12'
        retpagho:
          type: string
          nullable: true
          format: uri
          description: Event website URL.
          example: 'https://uea.org'
        retposhtadreso:
          type: string
          nullable: true
          format: email
          description: Contact email for the event.
          example: kontakto@uea.org
        organizoj:
          type: array
          description: List of organizing Esperanto organizations. Only present when the event has organizations.
          items:
            type: string
            example: UEA
        specoj:
          type: array
          description: Event type classifications.
          items:
            type: string
            example: Kongreso
        nuligita:
          type: boolean
          description: Whether the event has been cancelled.
          example: true
        nuligkialo:
          type: string
          nullable: true
          description: Reason for cancellation, if any.
          example: null
        reta:
          type: boolean
          description: Whether the event is online-only.
          example: true
        loko:
          type: object
          description: Event location. Null for online-only events.
          nullable: true
          properties:
            adreso:
              type: string
              nullable: true
              description: Street address.
              example: Stratnomo
            urbo:
              type: string
              description: City name.
              example: Bulonjo ĉe maro
            lando:
              type: string
              description: Country name.
              example: Francio
            landokodo:
              type: string
              description: 2-letter country code.
              example: FR
            kontinento:
              type: string
              description: Continent name.
              example: Eŭropo
            latitudo:
              type: number
              description: Latitude coordinate.
              example: 50.725231
            longitudo:
              type: number
              description: Longitude coordinate.
              example: 1.613334
          required:
            - urbo
            - lando
            - landokodo
            - kontinento
            - latitudo
            - longitudo
        administranto:
          type: string
          description: Name of the event organizer/admin user.
          example: Universala Esperanto-Asocio
      required:
        - uuid
        - kodo
        - titolo
        - priskribo
        - komenca_dato
        - fina_dato
        - retpagho
        - specoj
        - nuligita
        - reta
        - loko
        - administranto
    Organization:
      type: object
      description: An Esperanto organization with contact details.
      required:
        - name
        - short_name
        - contact
        - updated_at
      properties:
        name:
          type: string
          description: Full organization name.
          example: Universala Esperanto Asocio
        short_name:
          type: string
          description: Organization abbreviation or short name.
          example: UEA
        address:
          type: string
          nullable: true
          description: Physical address.
          example: 'Nieuwe Binnenweg 176, 3015 BJ Rotterdam'
        city:
          type: string
          nullable: true
          description: City where the organization is based.
          example: Rotterdam
        country:
          type: string
          nullable: true
          description: Country name.
          example: Nederlando
        country_code:
          type: string
          nullable: true
          description: 2-letter country code.
          example: NL
        contact:
          type: object
          description: Organization contact information.
          properties:
            email:
              type: string
              format: email
              nullable: true
              description: Contact email.
              example: info@uea.org
            phone:
              type: string
              nullable: true
              description: Contact phone number.
              example: '+31 10 436 1044'
            url:
              type: string
              format: uri
              nullable: true
              description: Organization website.
              example: 'https://uea.org'
            youtube:
              type: string
              format: uri
              nullable: true
              description: YouTube channel URL.
              example: 'https://www.youtube.com/user/UEAviva'
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp.
          example: '2024-08-31T16:54:32.114Z'
    ManagedEvent:
      type: object
      description: English representation of an EventaServo event.
      required:
        - uuid
        - code
        - title
        - description
        - date_start
        - date_end
        - time_zone
        - international_calendar
        - format
        - online
        - cancelled
        - organizations
        - tags
        - organizer
        - url
        - created_at
        - updated_at
      properties:
        uuid:
          type: string
          format: uuid
          example: 206da237-65ee-4b86-96f6-5bd4cc3bd210
        code:
          type: string
          example: ab6712d
        short_url:
          type: string
          nullable: true
          example: uk2026
        title:
          type: string
          example: 111-a Universala Kongreso
        description:
          type: string
          maxLength: 400
          example: The annual World Esperanto Congress.
        content:
          type: string
          nullable: true
          description: Detailed event description (HTML / rich text).
          example: '<div>Detailed program and registration info</div>'
        date_start:
          type: string
          format: date-time
          example: '2026-08-01T09:00:00+02:00'
        date_end:
          type: string
          format: date-time
          example: '2026-08-08T18:00:00+02:00'
        time_zone:
          type: string
          description: IANA time zone identifier.
          example: Europe/Graz
        site:
          type: string
          format: uri
          nullable: true
          example: 'https://uk.esperanto.net'
        email:
          type: string
          format: email
          nullable: true
          example: kontakto@uea.org
        international_calendar:
          type: boolean
          example: true
        format:
          type: string
          enum:
            - onsite
            - hybrid
            - online
          example: hybrid
        online:
          type: boolean
          example: true
        cancelled:
          type: boolean
          example: false
        cancel_reason:
          type: string
          nullable: true
          example: null
        location:
          type: object
          nullable: true
          description: Physical location details. Null for purely online events.
          properties:
            address:
              type: string
              nullable: true
              example: Messeplatz 1
            city:
              type: string
              example: Graz
            country:
              type: string
              nullable: true
              example: Aŭstrio
            country_code:
              type: string
              nullable: true
              example: at
            continent:
              type: string
              nullable: true
              example: Eŭropo
            latitude:
              type: number
              nullable: true
              example: 47.0604
            longitude:
              type: number
              nullable: true
              example: 15.4488
        organizations:
          type: array
          items:
            type: object
            required:
              - short_name
              - name
            properties:
              short_name:
                type: string
                example: UEA
              name:
                type: string
                example: Universala Esperanto-Asocio
        tags:
          type: array
          description: Category and characteristic tag names attached to the event.
          items:
            type: string
            example: Kongreso
        organizer:
          type: string
          description: Display name of the event owner.
          example: Universala Esperanto-Asocio
        url:
          type: string
          format: uri
          example: 'https://eventaservo.org/e/uk2026'
        created_at:
          type: string
          format: date-time
          example: '2026-11-19T18:00:00Z'
        updated_at:
          type: string
          format: date-time
          example: '2026-11-19T18:00:00Z'
    ManagedEventList:
      type: object
      required:
        - events
        - meta
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/ManagedEvent'
        meta:
          type: object
          required:
            - page
            - per_page
            - total_count
            - total_pages
          properties:
            page:
              type: integer
              example: 1
            per_page:
              type: integer
              example: 20
            total_count:
              type: integer
              example: 42
            total_pages:
              type: integer
              example: 3
    EventCreateInput:
      type: object
      description: Payload to create a new event. Either `site` or `email` must be provided.
      required:
        - title
        - description
        - date_start
        - date_end
      properties:
        title:
          type: string
          maxLength: 100
          example: Esperanto Meetup
        description:
          type: string
          maxLength: 400
          example: Monthly Esperanto conversation meetup.
        content:
          type: string
          nullable: true
          description: Detailed event description (plain text or HTML).
          example: '<p>Join us for coffee and conversation!</p>'
        date_start:
          type: string
          format: date-time
          description: ISO 8601 datetime. Explicit offset/Z preserves exact instant; naive datetime is interpreted in `time_zone`.
          example: '2026-08-01T14:00:00-03:00'
        date_end:
          type: string
          format: date-time
          example: '2026-08-01T17:00:00-03:00'
        time_zone:
          type: string
          description: IANA time zone identifier. Defaults to `Etc/UTC`.
          example: America/Sao_Paulo
        site:
          type: string
          format: uri
          nullable: true
          example: 'https://esperanto.org.br'
        email:
          type: string
          format: email
          nullable: true
          example: info@esperanto.org.br
        short_url:
          type: string
          maxLength: 32
          nullable: true
          example: sp-meetup-2026
        international_calendar:
          type: boolean
          default: false
        online:
          type: boolean
          default: false
          description: Set true without `city`/`country_code` for purely online events, or with `city`/`country_code` for hybrid events.
        address:
          type: string
          nullable: true
          example: Av. Paulista, 1000
        city:
          type: string
          nullable: true
          description: Required for onsite/hybrid events; automatically set to `Reta` for purely online events.
          example: São Paulo
        country_code:
          type: string
          nullable: true
          description: 2-letter ISO country code (case-insensitive). Required for onsite/hybrid events.
          example: br
        organization_short_names:
          type: array
          description: Short names of organizations the user belongs to (admins may link any organization).
          items:
            type: string
            example: UEA
        tags:
          type: array
          description: Tag names from `category` or `characteristic` groups.
          items:
            type: string
            example: Kunveno/Evento
    EventUpdateInput:
      type: object
      description: Partial payload to update an event. Omitted fields remain unchanged; sending `[]` for `tags` or `organization_short_names` clears them.
      properties:
        title:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 400
        content:
          type: string
          nullable: true
        date_start:
          type: string
          format: date-time
        date_end:
          type: string
          format: date-time
        time_zone:
          type: string
        site:
          type: string
          format: uri
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        short_url:
          type: string
          maxLength: 32
          nullable: true
        international_calendar:
          type: boolean
        online:
          type: boolean
        address:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        country_code:
          type: string
          nullable: true
        organization_short_names:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            type: string
    CancelEventInput:
      type: object
      properties:
        cancel_reason:
          type: string
          nullable: true
          example: Venue unavailable due to weather.
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: Event not found
    ValidationErrorResponse:
      type: object
      required:
        - error
        - details
      properties:
        error:
          type: string
          example: Validation failed
        details:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            title:
              - "can't be blank"
            country_code:
              - is not a valid country code
tags:
  - name: Events
    description: Legacy Esperanto event listing endpoints
  - name: Events (English)
    description: Full-lifecycle English event management endpoints
  - name: Organizations
    description: Organization-related endpoints
security:
