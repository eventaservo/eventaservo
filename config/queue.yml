default: &default
  dispatchers:
    - polling_interval: 15
      batch_size: 500
  workers:
    # Dedicated worker for ahoy queue - limited to 1 thread to avoid overload
    - queues: [ahoy]
      threads: 1
      processes: 1
      polling_interval: 30
    # Dedicated worker for heavy jobs like database backup
    - queues: [backup]
      threads: 1
      processes: 1
      polling_interval: 15
    # Worker for all other queues
    - queues: "*"
      threads: 2
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 10

development:
  <<: *default

test:
  <<: *default

staging:
  dispatchers:
    - polling_interval: 30
      batch_size: 500
  workers:
    # Single general worker for every queue. The former dedicated workers for
    # `ahoy` and `backup` did not isolate anything: a worker with `queues: "*"`
    # already polls those queues, so they only added whole Rails processes
    # (~200 MB each) to a queue that finishes about a hundred jobs per day.
    # Extra threads keep the daily backup from blocking everything else.
    - queues: "*"
      threads: 4
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 30

production:
  <<: *default
