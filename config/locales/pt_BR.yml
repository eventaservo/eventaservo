      history:
        eventoj_hu_link_text: Calendário de Eventoj.hu
        p1_html: "%{creator_link} criou o site Eventa Servo em 2017. Em sua cidade há poucos esperantistas, por isso os encontros são raros. Ele tinha certeza de que esperantistas atuavam em outras cidades e países, mas quais eventos eles organizavam? Onde? Quando? Ele criou o Eventa Servo para organizar tais informações."
        p2: Em abril de 2019, Fernando doou o sistema para a Associação Universal de Esperanto. Desde então, a UEA e a TEJO incentivam o uso do Eventa Servo para informar a comunidade esperantista sobre eventos internacionais, nacionais e locais, congressos, reuniões, encontros etc.
        p3_html: No final de 2020, o Eventa Servo tornou-se o sucessor oficial do %{link}.
        title: História
      partners:
        p: Agradecemos a estas empresas pela permissão para utilizar suas tecnologias gratuitamente no aprimoramento do Eventa Servo.
        title: Agradecimentos às empresas parceiras de tecnologia
      registered_events: eventos registrados
      registered_users: usuários registrados
      tagline: O sistema para divulgar eventos em Esperanto no mundo todo!
      title: Eventa Servo
      uea_tejo:
        p1_html: O Eventa Servo pertence à %{uea_link} com apoio da %{tejo_link}.
        p2: Ambas as organizações incentivam o uso do Eventa Servo para divulgar à comunidade esperantista eventos internacionais, nacionais e locais, congressos, reuniões, encontros etc.
        title: UEA e TEJO
