    ilei_html: "%{ilei_link}, a Liga Internacional de Professores Esperantistas, é o principal ponto de encontro para professores e educadores de Esperanto. A ILEI é uma associação especializada filiada à Associação Universal de Esperanto (UEA). Possui membros no mundo todo e seções em mais de 40 países. Seja você professor no ensino fundamental, médio ou superior, ministre cursos de Esperanto ou deseje trocar experiências com colegas -> %{join_link}"
    intro: Você está procurando um professor ou palestrante para o seu evento? Na lista abaixo você encontrará nomes de pessoas que indicaram no perfil do Eventa Servo que estão dispostas a ensinar e palestrar. Você encontrará detalhes nos respectivos perfis de usuário. Algumas pessoas se dispõem a ensinar e/ou palestrar gratuitamente, outras solicitam reembolso de despesas de viagem ou uma pequena compensação financeira. Às vezes é possível comparecer presencialmente; outras pessoas podem atuar apenas online. Mesmo que você não seja organizador de eventos, sinta-se à vontade para contatá-las — os esperantistas geralmente são muito prestativos!
