      helpers:
        p1_html: "%{yves_link} soube do Eventa Servo em 2018. Ele compreendeu imediatamente seu potencial e, por isso, ajudou bastante na divulgação do site. Hoje continua como 'colaborador principal': conselheiro, testador de novas funcionalidades e comunicador (com usuários e imprensa).<br>%{robin_link} também ajuda desde 2020 com consultoria e programação."
        p2_html: Agradecemos especialmente a %{fernando_link} vice-presidente da UEA, por seu apoio e ajuda na divulgação do Eventa Servo.
