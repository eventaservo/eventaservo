      history:
        eventoj_hu_link_text: Calendar of Eventoj.hu
        p1_html: "%{creator_link} created the Eventa Servo website in 2017. In his city there are few Esperanto speakers, so meetings are rare. He was certain that Esperantists were active in other cities and countries, but what events were they organizing? Where? When? He created Eventa Servo to organize this information."
