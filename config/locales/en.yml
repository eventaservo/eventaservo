        p1_html: "%{yves_link} learned about Eventa Servo in 2018. He immediately understood its potential and contributed greatly to promoting the site. Today he continues as 'lead helper': advisor, tester of new features, and communicator (with users and the press).<br>%{robin_link} has also been helping since 2020 with advice and programming."
