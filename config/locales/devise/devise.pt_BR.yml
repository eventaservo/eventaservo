---
pt_BR:
  devise:
    confirmations:
      confirmed: Seu endereço de e-mail foi confirmado com sucesso. Agora você pode entrar.
      send_instructions: Você receberá um e-mail com instruções para confirmar seu e-mail em alguns minutos.
      send_paranoid_instructions: Se o seu endereço de e-mail existir em nosso banco de dados, você receberá um e-mail com instruções para confirmá-lo em alguns minutos.
    failure:
      already_authenticated: Você já está conectado.
      inactive: Sua conta ainda não foi ativada.
      invalid: E-mail ou senha inválida.
      last_attempt: Você tem mais uma tentativa antes de sua conta ser bloqueada.
      locked: Sua conta está bloqueada.
      not_found_in_database: E-mail ou senha inválida.
      timeout: Sua sessão expirou. Por favor, entre novamente para continuar.
      unauthenticated: Você precisa entrar ou se cadastrar antes de continuar.
      unconfirmed: Você precisa confirmar seu endereço de e-mail antes de continuar.
    mailer:
      confirmation_instructions:
        subject: Instruções de confirmação
      email_changed:
        subject: E-mail alterado
      password_change:
        subject: Senha alterada
      reset_password_instructions:
        subject: Instruções de redefinição de senha
      unlock_instructions:
        subject: Instruções de desbloqueio
    omniauth_callbacks:
      failure: Não foi possível autenticar sua conta de %{kind} porque "%{reason}".
      success: Autenticado com sucesso com uma conta de %{kind}.
    passwords:
      no_token: Você não pode acessar esta página sem ter vindo de um e-mail de redefinição de senha. Se você veio de um e-mail de redefinição de senha, por favor certifique-se de que usou a URL completa fornecida.
      send_instructions: Você receberá um e-mail com instruções sobre como redefinir sua senha em alguns minutos.
      send_paranoid_instructions: Se o seu endereço de e-mail existir em nosso banco de dados, você receberá um link de recuperação de senha em alguns minutos.
      updated: Sua senha foi alterada com sucesso. Você agora está conectado.
      updated_not_active: Sua senha foi alterada com sucesso.
    registrations:
      destroyed: Tchau! Sua conta foi cancelada com sucesso. Esperamos ver você novamente em breve.
      signed_up: Boas-vindas! Você se cadastrou com sucesso.
      signed_up_but_inactive: Você se cadastrou com sucesso. No entanto, não pudemos autenticá-lo porque sua conta ainda não foi ativada.
      signed_up_but_locked: Você se cadastrou com sucesso. No entanto, não pudemos autenticá-lo porque sua conta está bloqueada.
      signed_up_but_unconfirmed: Uma mensagem com um link de confirmação foi enviada para o seu endereço de e-mail. Por favor, acesse o link para ativar sua conta.
      update_needs_confirmation: Você atualizou sua conta com sucesso, mas precisamos verificar seu novo endereço de e-mail. Por favor, cheque seu e-mail e clique no link de confirmação para confirmar seu novo e-mail.
      updated: Sua conta foi atualizada com sucesso.
    sessions:
      already_signed_out: Logout efetuado com sucesso.
      signed_in: Login efetuado com sucesso.
      signed_out: Logout efetuado com sucesso.
    unlocks:
      send_instructions: Você receberá um e-mail com instruções para desbloquear sua conta em alguns minutos.
      send_paranoid_instructions: Se sua conta existir, você receberá um e-mail com instruções para desbloqueá-la em alguns minutos.
      unlocked: Sua conta foi desbloqueada com sucesso. Por favor, entre para continuar.
  errors:
    messages:
      already_confirmed: já foi confirmado, por favor tente entrar
      confirmation_period_expired: precisa ser confirmado dentro de %{period}, por favor solicite um novo
      expired: expirou, por favor solicite um novo
      not_found: não encontrado
      not_locked: não foi bloqueado
      not_saved:
        one: '1 erro impediu que este(a) %{resource} fosse salvo(a):'
        other: "%{count} erros impediram que este(a) %{resource} fosse salvo(a):"
