    ilei_html: "%{ilei_link}, la Internacia Ligo de Esperantistaj Instruistoj estas la ĉefa kolektiĝejo por instruistoj kaj edukistoj de Esperanto. ILEI estas aliĝinta faka asocio de Universala Esperanto-Asocio (UEA). Ĝi havas membrojn en la tuta mondo kaj sekciojn en pli ol 40 landoj. Ĉu vi estas instruisto en bazlernejo, mezlernejo aŭ universitato, vi gvidas Esperanto-kursojn, vi interesiĝas pri instruado, vi deziras interŝanĝi spertojn kun kolegoj, vi volas subteni instruadon de Esperanto...? -> %{join_link}"
    intro: Ĉu vi serĉas instruanton aŭ preleganton por via evento? En la ĉi-suba listo vi trovos nomojn de homoj kiuj indikis ĉe sia profilo en Eventa Servo, ke ili pretas instrui kaj prelegi. Detalojn vi trovos ĉe la respektivaj uzantoprofiloj. Iuj homoj pretas senpage instrui kaj/aŭ prelegi, aliaj petas repagon de vojaĝkostoj aŭ etan financan rekompencon. Foje eblos veni surloke; aliuloj pretas aŭ povos pro praktikaj kialoj nur rete agi. Ankaŭ se vi ne estas organizanto de evento, eblas kontakti ilin – ne hezitu! – esperantistoj estas ĝenerale tre helpemaj.
