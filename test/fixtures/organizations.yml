# == Schema Information
#
# Table name: organizations
#
#  id           :bigint           not null, primary key
#  address      :string
#  city         :string
#  display_flag :boolean          default(TRUE)
#  email        :string
#  logo         :string
#  major        :boolean          default(FALSE)
#  name         :string           not null, indexed
#  official     :boolean          default(FALSE)
#  partner      :boolean          default(FALSE)
#  phone        :string
#  short_name   :string           not null, indexed
#  url          :string
#  youtube      :string
#  created_at   :datetime         not null
#  updated_at   :datetime         not null
#  country_id   :integer          default(99999)
#
# This fixture provides organizations for membership scenarios.
# The memberships themselves live in organization_users.yml.
#
# These organizations are loaded for every test, so assertions on absolute
# organization counts have to be relative to the table (Organization.count)
# instead of hardcoded.
#
# The names and short names are also deliberately different from the ones used
# by the factories and by the tests that create organizations inline ("uea",
# "bejo", "tejo", "fej", "testorg", ...): short_name has a unique index and
# those tests use Organization.create!, so reusing a value would break them.
#
# Names are kept after "FEJ" in alphabetical order so that organization
# ordering assertions do not change (Organizations::SearchQueryTest expects
# "FEJ" to be the first result when every organization is returned), and the
# countries are not the "nl" the API test filters by.

